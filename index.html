<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>GOLDREX</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0905;color:#ffe9a8;font-family:system-ui,sans-serif;min-height:100vh}
.s{padding:14px;max-width:460px;margin:auto}.h{display:none!important}
h1{text-align:center;color:#ffc933;margin:6px 0}
.card{background:#1a1408;border:1px solid #b8891d;border-radius:14px;padding:12px;margin:8px 0;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:#1a1408;border:1px solid #b8891d;border-radius:14px;padding:14px 6px;text-align:center;font-weight:700}
.g span{display:block;font-size:34px}.g small{color:#d9b25a;font-weight:400}
.chips{display:flex;gap:8px;justify-content:center;margin:8px 0}
.chip{padding:8px 12px;border:1px solid #b8891d;border-radius:20px;background:#1a1408}
.chip.on{background:#ffc933;color:#000;font-weight:700}
button{background:linear-gradient(#ffd24d,#e0a410);border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;width:100%;margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.bar div{background:#1a1408;border:1px solid #b8891d;border-radius:10px;padding:6px 10px;width:48%}
.bar b{display:block;color:#ffc933;font-size:20px}
#st{text-align:center;margin:8px 0;color:#ffc933}
.b8{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:3px solid #b8891d}
.q{display:flex;align-items:center;justify-content:center;position:relative}
.l{background:#f0d9b5}.d{background:#b58863}.sel{outline:3px solid #ffc933;outline-offset:-3px}
.tg::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(0,160,0,.55);position:absolute}
.p{font-size:min(8.5vw,38px);line-height:1}.p.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000}.p.k{color:#111}
.ck{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;color:#ffc933}
.ck.w{background:#f4f4f4;border:2px solid #999}.ck.k{background:#222;border:2px solid #000}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#1648c8;padding:6px;border-radius:10px}
.col{display:flex;flex-direction:column;gap:4px}
.dd{aspect-ratio:1;border-radius:50%;background:#0b1e66}.v1{background:#e22}.v2{background:#fc2}
#cv{width:100%;aspect-ratio:1;background:#06150a;border:3px solid #1e9e3a;border-radius:8px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pad button{margin:0;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:800;color:#ffc933}
.ov button{width:200px}
</style></head><body>
<div id="home" class="s">
 <h1>👑 GOLDREX</h1><div class="card" id="prof">Ulanmoqda…</div>
 <div class="chips" id="chips"></div><div class="grid" id="gl"></div>
 <p style="text-align:center;font-size:13px;color:#d9b25a">G'olib jamg'armaning 80% ini oladi. Durang bo'lsa tanga qaytariladi.</p>
</div>
<div id="wait" class="s h"><h2 style="text-align:center">⏳ Raqib qidirilmoqda…</h2><button onclick="send({t:'cancel'});show('home')">Bekor qilish</button></div>
<div id="gm" class="s h">
 <div class="bar"><div><span id="nm"></span><b id="c0"></b></div><div><span id="no"></span><b id="c1"></b></div></div>
 <div id="bd"></div><div id="st"></div><div id="ctl"></div>
 <button onclick="if(confirm('Taslim bo\'lasizmi?'))send({t:'resign'})">🏳 Taslim bo'lish</button>
</div>
<div id="ov" class="ov h"><div id="rs"></div><button onclick="document.getElementById('ov').classList.add('h');S=null;cv=null;show('home')">Davom etish</button></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=id=>document.getElementById(id);
const GAMES=[['chess','♟','Shaxmat','10 min'],['checkers','⚪','Shashka','5 min'],['connect4','🔴','4 ta tosh','5 min'],['snake','🐍','Snake Lite','60 soniya']];
const STAKES=[50,100,500,1000];let stake=100,S=null,you=0,sel=null,ws,cv=null;
const PC={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function show(id){document.querySelectorAll('.s').forEach(e=>e.classList.add('h'));$(id).classList.remove('h')}
function send(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))}
function chips(){$('chips').innerHTML=STAKES.map(s=>`<div class="chip ${s==stake?'on':''}" onclick="stake=${s};chips()">🪙 ${s}</div>`).join('')}
chips();$('gl').innerHTML=GAMES.map(g=>`<div class="g" onclick="send({t:'join',game:'${g[0]}',stake:stake})"><span>${g[1]}</span>${g[2]}<br><small>${g[3]}</small></div>`).join('');
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>send({init:tg.initData});ws.onmessage=e=>on(JSON.parse(e.data));ws.onclose=()=>setTimeout(conn,1500)}
function on(m){
 if(m.t=='me')$('prof').innerHTML=`<b>${m.name}</b> · 🛡 ${m.lvl} LVL<br>🪙 ${m.coins} · 🏅 ${m.wins} g'alaba · 🟢 ${m.online} online`;
 else if(m.t=='queue')show('wait');
 else if(m.t=='state'){S=m;S.at=Date.now();you=m.you;render()}
 else if(m.t=='end'){const t={win:'🏆 G\'alaba!',lose:'😔 Mag\'lubiyat',draw:'🤝 Durang'}[m.res];
  $('rs').innerHTML=t+(m.delta?`<br>${m.delta>0?'+':''}${m.delta} tanga`:'');$('ov').classList.remove('h')}
 else if(m.t=='err'){tg.showAlert(m.msg);show('home')}
}
const fmt=v=>{v=Math.ceil(v);return String(v/60|0).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
function render(){show('gm');const s=S,b=$('bd');$('nm').textContent=s.names[you]+' (Siz)';$('no').textContent=s.names[1-you];
 if(s.kind=='snake'){$('c0').textContent='🍎 '+s.sc[0];$('c1').textContent='🍎 '+s.sc[1];
  $('st').textContent=s.alive?'Vaqt: '+Math.ceil(s.left)+' s':'💀 Yiqildingiz, raqib tugashini kuting';drawSnake();return}
 $('st').textContent=(s.turn==you?'🟢 Sizning yurishingiz':'⏳ Raqib yurishi')+(s.check?' · ♚ Shoh!':'');$('ctl').innerHTML='';
 if(s.kind=='connect4'){b.className='c4';let h='';
  for(let c=0;c<7;c++){h+=`<div class="col" onclick="mv(${c})">`;for(let r=0;r<6;r++)h+=`<i class="dd v${s.board[r*7+c]}"></i>`;h+='</div>'}
  b.innerHTML=h;return}
 b.className='b8';const L=s.legal||{},tg2=sel!=null&&s.turn==you?(L[sel]||[]):[];
 const ord=[...Array(64).keys()];if(you==1)ord.reverse();let h='';
 for(const i of ord){const r=i>>3,c=i&7,p=s.board[i];let pc='';
  if(p)pc=s.kind=='chess'?`<span class="p ${p==p.toUpperCase()?'w':'k'}">${PC[p.toLowerCase()]}</span>`:`<i class="ck ${p.toLowerCase()=='w'?'w':'k'}">${p==p.toUpperCase()?'♛':''}</i>`;
  h+=`<div class="q ${(r+c)%2?'d':'l'} ${i==sel?'sel':''} ${tg2.includes(i)?'tg':''}" onclick="clk(${i})">${pc}</div>`}
 b.innerHTML=h}
function clk(i){if(!S||S.turn!=you)return;const L=S.legal||{};
 if(sel!=null&&(L[sel]||[]).includes(i)){send({t:'move',f:sel,to:i});sel=null;return}
 sel=L[i]?i:null;render()}
function mv(c){if(S&&S.turn==you)send({t:'move',col:c})}
function dir(d){send({t:'move',d})}
function drawSnake(){const s=S;if(!cv){$('bd').className='';$('bd').innerHTML='<canvas id="cv" width="320" height="320"></canvas>';cv=$('cv');
  $('ctl').innerHTML=`<div class="pad"><i></i><button onclick="dir([-1,0])">▲</button><i></i><button onclick="dir([0,-1])">◀</button><button onclick="dir([1,0])">▼</button><button onclick="dir([0,1])">▶</button></div>`;
  let x0,y0;cv.ontouchstart=e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY};
  cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
   if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?dir([0,dx>0?1:-1]):dir([dy>0?1:-1,0])}}
 const x=cv.getContext('2d'),z=20;x.fillStyle='#06150a';x.fillRect(0,0,320,320);
 x.fillStyle='#e22';x.beginPath();x.arc(s.apple[1]*z+10,s.apple[0]*z+10,8,0,7);x.fill();
 s.body.forEach((p,i)=>{x.fillStyle=i?'#2fdc55':'#9bff6a';x.fillRect(p[1]*z+1,p[0]*z+1,z-2,z-2)})}
addEventListener('keydown',e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m&&S&&S.kind=='snake')dir(m)});
setInterval(()=>{if(!S||S.kind=='snake'||!S.tl)return;const e=(Date.now()-S.at)/1000;
 for(const k of [0,1])$('c'+(k==you?0:1)).textContent=fmt(Math.max(0,S.tl[k]-(S.turn==k?e:0)))},250);
conn();
</script></body></html>
